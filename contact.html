
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Me - Mariam Al-Tibi</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Get in Touch</h1>
        <p>Mariam Abdulilah Mohammad Al-Tibi</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="contact.html">Contact Me</a>
    </nav>

    <main>

        <div class="container">

            <h2>Send Me a Message</h2>

            <form id="contactForm" onsubmit="return validateForm()" novalidate>

                <div class="form-group">
                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname"
                           name="fullname" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address:</label>
                    <input type="email" id="email"
                           name="email" required>
                </div>

                <div class="form-group">
                    <label for="country">Country:</label>
                    <input type="text" id="country"
                           name="country" required>
                </div>

                <div class="form-group">
                    <label for="comments">Comments / Message:</label>
                    <textarea id="comments" name="comments"
                              rows="4" required></textarea>
                </div>

                <button type="submit">Submit</button>

            </form>

        </div>

    </main>

    <footer>
        <p>&copy; 2026 Mariam Abdulilah Mohammad Al-Tibi. All Rights Reserved.</p>
    </footer>

    <script>

        function validateForm() {

            var name = document.getElementById("fullname").value;
            var email = document.getElementById("email").value;
            var country = document.getElementById("country").value;
            var comments = document.getElementById("comments").value;

            if (
                name.trim() === "" ||
                email.trim() === "" ||
                country.trim() === "" ||
                comments.trim() === ""
            ) {

                alert("Please fill in all the required fields.");
                return false;

            }

            alert("Your form has been submitted successfully. Thank you!");

            return false;
        }

    </script>

</body>
</html>
